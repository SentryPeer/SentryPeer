name: Coverity Scan
on:
  schedule:
    - cron: '0 11 * * *' # Daily at 11:00 UTC
  workflow_dispatch:

jobs:
  scan-latest:
    runs-on: ubuntu-latest
    steps:
      - name: Add Homebrew to $PATH
        run: echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> $GITHUB_PATH
      - name: Test brew call
        run: brew search hello
      - uses: actions/checkout@v2
      - name: Fetch Dependencies
        run: |
          set -x
          sudo apt-get update
          sudo apt-get -y install \
            git \
            build-essential \
            autoconf-archive \
            curl \
            wget \
            libosip2-dev \
            libcmocka-dev \
            uuid-dev \
            libmicrohttpd-dev \
            libjansson-dev \
            libpcre2-dev \
            libsqlite3-dev \
            libcurl4-openssl-dev
            brew update
            brew upgrade          
            brew install libosip opendht
      - name: Download Coverity Build Tool
        run: |
          wget -q https://scan.coverity.com/download/linux64 --post-data "token=$TOKEN&project=SentryPeer%2FSentryPeer" -O cov-analysis-linux64.tar.gz
          mkdir coverity-tools
          tar xzf cov-analysis-linux64.tar.gz --strip 1 -C coverity-tools
          rm cov-analysis-linux64.tar.gz
          echo "$GITHUB_WORKSPACE/coverity-tools/bin" >> "$GITHUB_PATH"
        env:
          TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}

      - name: Validate Coverity version
        run: |
          if version=$(cov-build --version 2>&1); then
            echo "$version"
            if [[ ! "$version" =~ version[[:space:]](2024\.12\.1|2024\.6\.1)([[:space:]]|$) ]]; then
              echo "::error::Unsupported cov-build version. Expected 2024.12.1 or 2024.6.1."
              exit 1
            fi
          else
            echo "::notice::cov-build does not support --version; skipping version validation."
          fi

      - name: Run bootstrap.sh
        run: ./bootstrap.sh

      - name: Configure
        run: ./configure --disable-rust

      - name: Build
        run: |
          ( cov-build --dir cov-int sh -c 'make -j 3 && make -j 3 check TESTS=' )
          cat cov-int/build-log.txt

      - name: Restrict Coverity scan to src and tests only
        run: |
          # Remove every captured translation unit not under src/ or tests/ (e.g. sentrypeer_rust)
          if filter_output=$(cov-manage-emit --dir cov-int --tu-pattern \
            "!(file('^$GITHUB_WORKSPACE/src/') || file('^$GITHUB_WORKSPACE/tests/'))" delete 2>&1); then
            echo "$filter_output"
          elif [[ "$filter_output" == *"No matching translation units."* ]]; then
            echo "$filter_output"
          else
            echo "$filter_output" >&2
            exit 1
          fi
          cov-manage-emit --dir cov-int list

      - name: Submit the result to Coverity Scan
        run: |
          tar -czvf sentrypeer.tar.gz cov-int
          curl \
            --form token=$TOKEN \
            --form email=ghenry@antnetworks.com \
            --form file=@sentrypeer.tar.gz \
            --form version=main \
            --form description="`git rev-parse HEAD`" \
            https://scan.coverity.com/builds?project=SentryPeer%2FSentryPeer
        env:
          TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}
